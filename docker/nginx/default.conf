# nginx SIRABTOR di dalam kontainer (di belakang proksi TLS Coolify/Traefik atau nginx/Caddy server).

# Pemeriksaan kesehatan /up tiap 30 detik tidak dicatat di log akses.
map $request_uri $catat_akses {
    ~^/up(\?|$) 0;
    default      1;
}

server {
    listen 8080 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    access_log /var/log/nginx/access.log combined if=$catat_akses;

    # Unggahan terbesar 10 MB + sisa formulir (sama dengan post_max_size PHP).
    client_max_body_size 25m;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml;

    # Aset Vite berhash: aman di-cache lama.
    location /build/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        # Saran AI & pembuatan PDF bisa lama (batas waktu penyedia AI maks. 300 detik).
        fastcgi_read_timeout 360s;
        fastcgi_send_timeout 360s;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
    }

    # Berkas PHP lain & berkas tersembunyi tidak pernah dilayani.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
