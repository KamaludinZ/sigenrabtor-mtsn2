; Pool PHP-FPM SIRABTOR (menimpa nilai bawaan www.conf image php-fpm; port 9000 dari zz-docker.conf).
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Lebih lama dari batas waktu AI terpanjang (300 detik).
request_terminate_timeout = 360s

; Variabel lingkungan kontainer (APP_KEY, DB_*, SIRABTOR_*) tetap terbaca PHP.
clear_env = no
; HOME root (warisan supervisord) tidak bisa ditulis www-data — LibreOffice/fontconfig menulis cache di HOME.
env[HOME] = /tmp
catch_workers_output = yes
decorate_workers_output = no
