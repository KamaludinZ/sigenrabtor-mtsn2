; PHP produksi SIRABTOR (image Docker).
expose_php = Off
memory_limit = 512M
; Panggilan AI boleh sampai 300 detik (batas waktu penyedia di Pengaturan AI), PDF ~90 detik.
max_execution_time = 360
max_input_time = 120
max_input_vars = 5000
; Unggahan terbesar 10 MB (master KAK/TOR, arsip final PDF) + unggahan sementara Livewire (≤ 12 MB).
upload_max_filesize = 20M
post_max_size = 25M
date.timezone = Asia/Jakarta
default_charset = "UTF-8"

session.use_strict_mode = 1
session.cookie_httponly = 1

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Kode di image tidak berubah selama kontainer berjalan.
opcache.validate_timestamps = 0
opcache.jit = tracing
opcache.jit_buffer_size = 64M

realpath_cache_size = 4096K
realpath_cache_ttl = 600
