; Proses kontainer SIRABTOR: web (nginx + PHP-FPM), pekerja antrean, dan penjadwal Laravel.
; Semua log diteruskan ke stdout/stderr kontainer (dibaca `docker logs`/Coolify).
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; Saat kontainer dihentikan (redeploy): QUIT = berhenti anggun — permintaan yang sedang berjalan dituntaskan dulu.
[program:php-fpm]
command=php-fpm -F
priority=10
autorestart=true
stopsignal=QUIT
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=20
autorestart=true
stopsignal=QUIT
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:antrean]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --timeout=360 --max-time=3600
user=www-data
directory=/var/www/html
environment=HOME="/tmp"
priority=30
autorestart=true
stopwaitsecs=370
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:penjadwal]
command=php /var/www/html/artisan schedule:work
user=www-data
directory=/var/www/html
environment=HOME="/tmp"
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
